# .github/workflows/pipeline.yml
name: Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # GitLab schedules live in the UI; adjust as needed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, ${{ github.actor }}!"

  test-job1:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job tests something"

  test-job2:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This job tests something, but takes more time than test-job1."
          echo "After the echo commands complete, it runs the sleep command for 20 seconds"
          echo "which simulates a test that runs 20 seconds longer than test-job1"
          sleep 20

  snyk-security-scan:
    needs: [test-job1, test-job2]
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Snyk tooling
        run: npm install -g snyk snyk-to-html

      - name: Snyk scans (SCA + Code)
        run: |
          set +e

          # --- SCA (open source dependency) scan ---
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --json-file-output=snyk-sca-results.json \
            --sarif-file-output=snyk-sca.sarif
          SCA_EXIT=$?
          echo "Snyk SCA exit code: $SCA_EXIT"

          # --- SAST (Snyk Code) scan ---
          snyk code test \
            --severity-threshold=high \
            --json-file-output=snyk-code-results.json \
            --sarif-file-output=snyk-code.sarif
          CODE_EXIT=$?
          echo "Snyk Code exit code: $CODE_EXIT"

          echo "SCA_EXIT=$SCA_EXIT" >> "$GITHUB_ENV"
          echo "CODE_EXIT=$CODE_EXIT" >> "$GITHUB_ENV"

      - name: Generate HTML reports
        if: always()
        run: |
          if [ -f snyk-sca-results.json ]; then
            snyk-to-html -i snyk-sca-results.json -o snyk-sca-report.html -a
          else
            echo "No SCA JSON output to convert (scan may not have produced results)."
          fi

          if [ -f snyk-code-results.json ]; then
            snyk-to-html -i snyk-code-results.json -o snyk-code-report.html -a
          else
            echo "No SAST JSON output to convert (likely no issues were found)."
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports
          retention-days: 30
          if-no-files-found: ignore
          path: |
            snyk-sca-results.json
            snyk-code-results.json
            snyk-sca.sarif
            snyk-code.sarif
            snyk-sca-report.html
            snyk-code-report.html

      # Optional: GitLab's sast/dependency_scanning report equivalent.
      # Requires `security-events: write` permission and Code Scanning availability.
      # - uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: snyk-code.sarif

      - name: Fail on High/Critical findings
        run: |
          echo "Snyk SCA exit code: $SCA_EXIT"
          echo "Snyk Code exit code: $CODE_EXIT"
          FAIL=0

          if [ "$SCA_EXIT" = "1" ]; then
            echo "ERROR: Snyk Open Source (SCA) found High/Critical severity vulnerabilities."
            FAIL=1
          elif [ "$SCA_EXIT" = "3" ]; then
            echo "WARNING: No supported manifest files found; SCA skipped."
          elif [ "$SCA_EXIT" != "0" ]; then
            echo "ERROR: Snyk Open Source (SCA) scan failed to run (exit code $SCA_EXIT)."
            FAIL=1
          fi

          if [ "$CODE_EXIT" = "1" ]; then
            echo "ERROR: Snyk Code (SAST) found High/Critical severity issues."
            FAIL=1
          elif [ "$CODE_EXIT" != "0" ]; then
            echo "ERROR: Snyk Code (SAST) scan failed to run (exit code $CODE_EXIT)."
            FAIL=1
          fi

          exit $FAIL

  deploy-prod:
    needs: snyk-security-scan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "This job deploys something from the ${{ github.ref_name }} branch."
      
